name: build-php
on:
  push:
    branches: [master]
    paths:
      - "services/php/**"
      - ".github/workflows/build-php.yml"
      - ".env"
  workflow_dispatch:
concurrency:
  group: build-php-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE_NAME: myapp-php
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read PHP version from .env
        id: ver
        run: |
          if [ ! -f .env ]; then
            echo "::error::仓库中不存在 .env 文件，当前目录内容："
            ls -la
            exit 1
          fi
          version="$(grep -E '^PHP_VERSION=' .env | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
          tz="$(grep -E '^TZ=' .env | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::.env 中未找到 PHP_VERSION，文件内容如下："
            cat .env
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tz=${tz:-Asia/Shanghai}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./services/php
          file: ./services/php/Dockerfile
          push: false
          load: true
          provenance: false
          build-args: |
            PHP_VERSION=${{ steps.ver.outputs.version }}
            TZ=${{ steps.ver.outputs.tz }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Push to GHCR
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done
      - name: Export image tar
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}"
          docker save "$IMAGE" -o "myapp-php-${{ steps.ver.outputs.version }}.tar"
          docker image inspect "$IMAGE" --format 'tag={{ .RepoTags }} size={{ .Size }} arch={{ .Architecture }}/{{ .Os }}'
          ls -lh myapp-php-*.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-php-${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          path: myapp-php-*.tar
          retention-days: 14
          if-no-files-found: error
